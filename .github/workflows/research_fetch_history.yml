name: Research - Fetch deep history (XAU/USD)

on:
  workflow_dispatch:
    inputs:
      symbols:
        default: "XAU/USD"
      timeframes:
        default: "1h,4h"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch history into Neon
        env:
          TWELVE_DATA_API_KEY_1: ${{ secrets.TWELVE_DATA_API_KEY_1 }}
          TWELVE_DATA_API_KEY_2: ${{ secrets.TWELVE_DATA_API_KEY_2 }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ENVIRONMENT: development
          PYTHONPATH: .
          SYMBOLS: ${{ inputs.symbols }}
          TIMEFRAMES: ${{ inputs.timeframes }}
        run: python research/fetch_history.py
